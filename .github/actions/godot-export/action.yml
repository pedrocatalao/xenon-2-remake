name: Godot export
description: >
  Installs the Godot editor and the one export template a preset needs (both checked against
  Godot's own SHA-512 sums and cached), stamps the release's version into the project, imports
  the assets and exports the preset.

inputs:
  preset:
    description: Export preset name, as in export_presets.cfg
    required: true
  template:
    description: Template file inside the templates archive (e.g. linux_release.x86_64)
    required: true
  output:
    description: Path to export to
    required: true
  godot-version:
    description: Godot version (README says the project is made with 4.7.2)
    default: "4.7.2"

outputs:
  version:
    description: The version for file names, the release's tag without its v, or <project version>-dev.<commit>
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Where Godot goes
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot-version }}
      run: |
        case "$RUNNER_OS" in
          Linux)
            echo "GODOT_ZIP=Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" >> "$GITHUB_ENV"
            echo "GODOT=$HOME/godot/editor/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
            echo "GODOT_TEMPLATES=$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" >> "$GITHUB_ENV"
            ;;
          macOS)
            echo "GODOT_ZIP=Godot_v${GODOT_VERSION}-stable_macos.universal.zip" >> "$GITHUB_ENV"
            echo "GODOT=$HOME/godot/editor/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
            echo "GODOT_TEMPLATES=$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable" >> "$GITHUB_ENV"
            ;;
          *) echo "::error::no Godot export set up for $RUNNER_OS"; exit 1 ;;
        esac

    # The templates archive is 1.3 GB and holds every platform: it is downloaded only when
    # the cache is empty, and only the one template this job needs is kept.
    - name: Cache Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ inputs.godot-version }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.template }}

    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot-version }}
        TEMPLATE: ${{ inputs.template }}
      run: |
        base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
        tpz="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
        cd "$RUNNER_TEMP"
        curl -fsSL --retry 3 -O "$base/SHA512-SUMS.txt" -O "$base/$GODOT_ZIP" -O "$base/$tpz"
        grep -E "  ($GODOT_ZIP|$tpz)\$" SHA512-SUMS.txt > sums.txt
        test "$(wc -l < sums.txt)" -eq 2
        shasum -a 512 -c sums.txt
        mkdir -p ~/godot/editor ~/godot/templates
        unzip -q "$GODOT_ZIP" -d ~/godot/editor
        unzip -q -j "$tpz" "templates/$TEMPLATE" templates/version.txt -d ~/godot/templates
        rm -f "$GODOT_ZIP" "$tpz"

    - name: Install the template
      shell: bash
      run: |
        mkdir -p "$GODOT_TEMPLATES"
        cp ~/godot/templates/* "$GODOT_TEMPLATES/"
        chmod +x "$GODOT"
        "$GODOT" --version

    # On a release the tag (v1.2.3) becomes the version everywhere the exports carry one;
    # any other build keeps the project's version and says which commit it is.
    - name: Version
      id: version
      shell: bash
      env:
        TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      run: |
        if [ -n "$TAG" ]; then
          version="${TAG#v}"
          # macOS wants numbers only (1.2.3-beta -> 1.2.3), Windows four of them (1.2.3.0).
          plain="${version%%[-+]*}"
          numeric="$plain"
          dots="${numeric//[^.]/}"
          while [ "${#dots}" -lt 3 ]; do numeric="$numeric.0"; dots="$dots."; done
          export version plain numeric
          perl -pi -e 's/^config\/version=".*"/config\/version="$ENV{version}"/' project.godot
          perl -pi -e '
            s/^application\/product_version=".*"/application\/product_version="$ENV{version}"/;
            s/^(application\/(?:short_version|version))=".*"/$1="$ENV{plain}"/;
            s/^application\/file_version=".*"/application\/file_version="$ENV{numeric}"/;
            s/^application\/file_description="Xenon 2 remake .*"/application\/file_description="Xenon 2 remake $ENV{version}"/;
          ' export_presets.cfg
          git --no-pager diff --stat
        else
          project=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)
          version="${project}-dev.${GITHUB_SHA::7}"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "version: $version"

    - name: Import the assets
      shell: bash
      run: |
        "$GODOT" --headless --path . --import > "$RUNNER_TEMP/import.log" 2>&1 || { cat "$RUNNER_TEMP/import.log"; exit 1; }
        grep -E '^(ERROR|SCRIPT ERROR)' "$RUNNER_TEMP/import.log" && exit 1 || echo "imported"

    - name: Export
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        OUTPUT: ${{ inputs.output }}
      run: |
        mkdir -p "$(dirname "$OUTPUT")"
        "$GODOT" --headless --path . --export-release "$PRESET" "$OUTPUT"
        test -e "$OUTPUT"
